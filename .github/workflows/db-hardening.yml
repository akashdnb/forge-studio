name: Forge PostgreSQL Hardening

on:
  pull_request:
    paths:
      - 'migrations/**'
      - 'src/persistence/**'
      - 'scripts/verify-database-hardening.js'
      - 'test/**'
      - '.github/workflows/db-hardening.yml'
  push:
    branches: [main]
    paths:
      - 'migrations/**'
      - 'src/persistence/**'
      - 'scripts/verify-database-hardening.js'
      - 'test/**'
      - '.github/workflows/db-hardening.yml'

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: forge
          POSTGRES_USER: forge
          POSTGRES_DB: forge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://forge:forge@localhost:5432/forge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Bootstrap current release safety schema
        run: node -e "const fs=require('fs');const {Client}=require('pg');(async()=>{const c=new Client({connectionString:process.env.DATABASE_URL});await c.connect();await c.query(fs.readFileSync('migrations/013_release_safety.sql','utf8'));await c.end()})().catch(e=>{console.error(e);process.exit(1)})"
      - run: npm run check
      - run: npm run migrate
      - run: node --test test/database-hardening.test.js test/postgres-integrity.integration.test.js
      - run: node scripts/verify-database-hardening.js
