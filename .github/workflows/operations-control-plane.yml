name: Forge Operations Control Plane

on:
  pull_request:
    paths:
      - 'src/operations/**'
      - 'migrations/**'
      - 'test/operations-control-plane.integration.test.js'
      - '.github/workflows/operations-control-plane.yml'

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm test
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/forge_test
