name: Forge Production Acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge_acceptance
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U forge -d forge_acceptance"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Install and verify system FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          FFMPEG_PATH="$(command -v ffmpeg)"
          FFPROBE_PATH="$(command -v ffprobe)"
          test -n "$FFMPEG_PATH"
          test -n "$FFPROBE_PATH"
          "$FFMPEG_PATH" -version >/dev/null
          "$FFPROBE_PATH" -version >/dev/null
          echo "FFMPEG_PATH=$FFMPEG_PATH" >> "$GITHUB_ENV"
          echo "FORGE_FFMPEG_COMMAND=$FFMPEG_PATH" >> "$GITHUB_ENV"
          echo "FORGE_FFMPEG_PATH=$FFMPEG_PATH" >> "$GITHUB_ENV"
          echo "FORGE_FFPROBE_PATH=$FFPROBE_PATH" >> "$GITHUB_ENV"
      - run: node --check scripts/acceptance-entrypoint.js
      - run: node --check scripts/run-acceptance-v2.js
      - run: node --check scripts/acceptance-final-artifact-gate.js
      - run: node --test test/acceptance-final-artifact-harness.test.js
      - name: Install audio-bearing acceptance fixture shim
        run: |
          chmod +x scripts/acceptance-ffmpeg-fixture-shim.sh
          mkdir -p "$RUNNER_TEMP/forge-acceptance-bin"
          ln -sf "$GITHUB_WORKSPACE/scripts/acceptance-ffmpeg-fixture-shim.sh" "$RUNNER_TEMP/forge-acceptance-bin/ffmpeg"
          echo "$RUNNER_TEMP/forge-acceptance-bin" >> "$GITHUB_PATH"
      - name: Run happy-path acceptance
        run: |
          set +e
          npm run acceptance > acceptance.log 2>&1
          rc=$?
          cat acceptance.log
          exit $rc
        env:
          DATABASE_URL: postgres://forge:forge@127.0.0.1:5432/forge_acceptance
          FORGE_STATIC_TENANT_ID: tenant:acceptance
          FORGE_ACCEPTANCE_SCENARIO: happy-path
          FORGE_ACCEPTANCE_SEED: github-${{ github.run_id }}-happy-path
          FORGE_ACCEPTANCE_STORAGE: ${{ runner.temp }}/forge-acceptance
      - name: Upload acceptance failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: forge-acceptance-failure
          path: |
            acceptance.log
            ${{ runner.temp }}/forge-acceptance
          if-no-files-found: warn
      - run: node scripts/acceptance-final-artifact-gate.js
        env:
          DATABASE_URL: postgres://forge:forge@127.0.0.1:5432/forge_acceptance
          FORGE_STATIC_TENANT_ID: tenant:acceptance
          FORGE_ACCEPTANCE_SEED: github-${{ github.run_id }}-happy-path
          FORGE_ACCEPTANCE_STORAGE: ${{ runner.temp }}/forge-acceptance
