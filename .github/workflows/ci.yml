name: Forge CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://forge:forge@localhost:5432/forge_test
      FORGE_RUN_RECOVERY_INTEGRATION: "true"
      FORGE_CREDENTIAL_INTEGRATION: "true"
      FORGE_SECRET_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      FORGE_FRESH_DB_ON_START: "true"
      FORGE_STATIC_TENANT_ID: tenant:acceptance
      FORGE_ACCEPTANCE_SCENARIO: happy-path
      FORGE_ACCEPTANCE_SEED: github-ci
      FORGE_ACCEPTANCE_STORAGE: .forge-ci-acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm install --no-save --no-audit --no-fund ffmpeg-static@5.2.0 @ffprobe-installer/ffprobe@2.1.2
      - name: Configure bundled media tools
        run: |
          FFMPEG_PATH="$(find node_modules/ffmpeg-static -type f -name ffmpeg | head -1)"
          FFPROBE_PATH="$(find node_modules/@ffprobe-installer/ffprobe -type f -name ffprobe | head -1)"
          printf 'ffmpeg=%s\nffprobe=%s\n' "$FFMPEG_PATH" "$FFPROBE_PATH"
          test -n "$FFMPEG_PATH"
          test -n "$FFPROBE_PATH"
          chmod +x "$FFMPEG_PATH" "$FFPROBE_PATH"
          echo "FORGE_FFMPEG_COMMAND=$FFMPEG_PATH" >> "$GITHUB_ENV"
          echo "FORGE_FFMPEG_PATH=$FFMPEG_PATH" >> "$GITHUB_ENV"
          echo "FORGE_FFPROBE_PATH=$FFPROBE_PATH" >> "$GITHUB_ENV"
      - run: node scripts/client-contract.js
      - run: node scripts/canonical-schema-bootstrap.js
      - run: node --check scripts/acceptance-entrypoint.js
      - run: node --check scripts/run-acceptance-v2.js
      - run: node --check scripts/acceptance-final-artifact-gate.js
      - run: node --test test/acceptance-final-artifact-harness.test.js
      - run: npm run acceptance
      - run: node scripts/acceptance-final-artifact-gate.js
        env:
          DATABASE_URL: postgres://forge:forge@localhost:5432/forge_test
          FORGE_STATIC_TENANT_ID: tenant:acceptance
          FORGE_ACCEPTANCE_SEED: github-ci-happy-path
          FORGE_ACCEPTANCE_STORAGE: .forge-ci-acceptance
      - run: node --test test/recovery-postgres.integration.test.js
      - run: node --test test/provider-credential-registry.test.js
