name: Forge CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: forge
          POSTGRES_PASSWORD: forge
          POSTGRES_DB: forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forge -d forge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://forge:forge@localhost:5432/forge_test
      FORGE_RUN_RECOVERY_INTEGRATION: "true"
      FORGE_CREDENTIAL_INTEGRATION: "true"
      FORGE_SECRET_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: node scripts/client-contract.js
      - run: npm run migrate
      - run: npm run check
      - run: node --test test/recovery-postgres.integration.test.js
      - run: node --test test/provider-credential-registry.test.js
      - run: npm test
      - name: Install audio-bearing acceptance fixture shim
        run: |
          chmod +x scripts/acceptance-ffmpeg-fixture-shim.sh
          mkdir -p "$RUNNER_TEMP/forge-acceptance-bin"
          ln -sf "$GITHUB_WORKSPACE/scripts/acceptance-ffmpeg-fixture-shim.sh" "$RUNNER_TEMP/forge-acceptance-bin/ffmpeg"
          echo "$RUNNER_TEMP/forge-acceptance-bin" >> "$GITHUB_PATH"
      - name: Run representative production acceptance
        run: npm run acceptance
        env:
          FORGE_ACCEPTANCE_SCENARIO: happy-path
          FORGE_ACCEPTANCE_SEED: github-${{ github.run_id }}
          FORGE_ACCEPTANCE_STORAGE: ${{ runner.temp }}/forge-acceptance
      - name: Verify persisted final media artifact
        run: node scripts/acceptance-final-artifact-gate.js
        env:
          FORGE_ACCEPTANCE_SEED: github-${{ github.run_id }}-happy-path
          FORGE_ACCEPTANCE_STORAGE: ${{ runner.temp }}/forge-acceptance
      - run: npm run demo -- "Why volcanoes erupt"
