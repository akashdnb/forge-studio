name: Forge Release Safety

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d forge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/forge_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/forge_test
      NODE_OPTIONS: --test-concurrency=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Bootstrap current release safety schema
        run: node -e "const fs=require('fs');const {Client}=require('pg');(async()=>{const c=new Client({connectionString:process.env.DATABASE_URL});await c.connect();await c.query(fs.readFileSync('migrations/013_release_safety.sql','utf8'));await c.end()})().catch(e=>{console.error(e);process.exit(1)})"
      - run: |
          node --check src/release-safety/release-safety.js
          node --check src/release-safety/migration-runner.js
          node --check src/release-safety/deployment-safety.js
          node --check src/release-safety/runtime-guards.js
          node --check src/release-safety/http.js
          node --check src/persistence/job-queue.js
          node --check src/runtime/worker-entry.js
          node --check src/execution/public-github-actions-backend.js
          node --check src/execution/github-actions-callback.js
          node --check src/versioned-server.js
          node --check src/release-safety/deployment-controller.js
          node --check src/versioned-server.js
          node --check scripts/release-preflight.js
          node --check scripts/release-control.js
      - run: node --test test/release-safety.test.js test/release-deployment-safety.integration.test.js
      - run: npm run release:preflight -- --manifest release-manifest.example.json
