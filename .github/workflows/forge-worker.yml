name: Forge worker runner
run-name: Forge ${{ inputs.worker_type }} ${{ inputs.job_id }} ${{ inputs.correlation_id }}
on:
  workflow_call:
    inputs:
      job_id: { required: true, type: string }
      episode_id: { required: false, type: string }
      worker_type: { required: true, type: string }
      correlation_id: { required: true, type: string }
      idempotency_key: { required: true, type: string }
      ref: { required: true, type: string }
    secrets:
      DATABASE_URL: { required: true }
      FORGE_RUNNER_CALLBACK_TOKEN: { required: false }
      FORGE_RUNNER_CALLBACK_URL: { required: false }
      FORGE_STORAGE_S3_BUCKET: { required: false }
      FORGE_STORAGE_S3_REGION: { required: false }
      FORGE_STORAGE_S3_ENDPOINT: { required: false }
      AWS_ACCESS_KEY_ID: { required: false }
      AWS_SECRET_ACCESS_KEY: { required: false }
      FORGE_WHISPER_COMMAND: { required: false }
      FORGE_WHISPER_MODEL: { required: false }
      FORGE_WHISPER_ARGS: { required: false }
permissions:
  contents: read
concurrency:
  group: forge-${{ inputs.worker_type }}-${{ inputs.job_id }}
  cancel-in-progress: false
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FORGE_RUNNER_CALLBACK_URL: ${{ secrets.FORGE_RUNNER_CALLBACK_URL }}
      FORGE_RUNNER_CALLBACK_TOKEN: ${{ secrets.FORGE_RUNNER_CALLBACK_TOKEN }}
      FORGE_STORAGE_DRIVER: s3
      FORGE_STORAGE_S3_BUCKET: ${{ secrets.FORGE_STORAGE_S3_BUCKET }}
      FORGE_STORAGE_S3_REGION: ${{ secrets.FORGE_STORAGE_S3_REGION }}
      FORGE_STORAGE_S3_ENDPOINT: ${{ secrets.FORGE_STORAGE_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      FORGE_WHISPER_COMMAND: ${{ secrets.FORGE_WHISPER_COMMAND }}
      FORGE_WHISPER_MODEL: ${{ secrets.FORGE_WHISPER_MODEL }}
      FORGE_WHISPER_ARGS: ${{ secrets.FORGE_WHISPER_ARGS }}
      FORGE_STORAGE_S3_FORCE_PATH_STYLE: ${{ vars.FORGE_STORAGE_S3_FORCE_PATH_STYLE || 'false' }}
      FORGE_QA_TIMEOUT_MS: ${{ vars.FORGE_QA_TIMEOUT_MS || '600000' }}
      FORGE_QA_MAX_BYTES: ${{ vars.FORGE_QA_MAX_BYTES || '5368709120' }}
      FORGE_QA_ALLOWED_MEDIA_HOSTS: ${{ vars.FORGE_QA_ALLOWED_MEDIA_HOSTS || '' }}
      FORGE_RENDER_TIMEOUT_MS: ${{ vars.FORGE_RENDER_TIMEOUT_MS || '900000' }}
      FORGE_TRANSCRIPTION_TIMEOUT_MS: ${{ vars.FORGE_TRANSCRIPTION_TIMEOUT_MS || '900000' }}
      FORGE_TRANSCRIPTION_MAX_INPUT_BYTES: ${{ vars.FORGE_TRANSCRIPTION_MAX_INPUT_BYTES || '2147483648' }}
      FORGE_TRANSCRIPTION_MAX_OUTPUT_BYTES: ${{ vars.FORGE_TRANSCRIPTION_MAX_OUTPUT_BYTES || '67108864' }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: ${{ inputs.ref }}, fetch-depth: 1, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm install --no-audit --no-fund --ignore-scripts
      - name: Install FFmpeg
        if: inputs.worker_type == 'media-ffmpeg' || inputs.worker_type == 'qa'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Execute bounded Forge worker
        run: node scripts/run-github-worker-job.js "${{ inputs.job_id }}" "${{ inputs.worker_type }}"
