name: build-canonical-schema
on:
  push:
    branches: ["codex/fresh-db-schema"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shogo82148/actions-setup-postgresql@v1
        with:
          postgresql-version: '16'
      - name: Build canonical schema
        shell: bash
        run: |
          set -euo pipefail
          createdb forge_test
          node - <<'NODE'
          const fs=require('fs'); const path=require('path'); const {execFileSync}=require('child_process');
          const files=fs.readdirSync('migrations').filter(f=>/^\d+_[a-z0-9_-]+\.sql$/i.test(f)).sort();
          for(const f of files){ console.log(`Applying ${f}`); fs.writeFileSync('/tmp/current.sql',fs.readFileSync(path.join('migrations',f),'utf8')); execFileSync('psql',['-v','ON_ERROR_STOP=1','-d','forge_test','-f','/tmp/current.sql'],{stdio:'inherit'}); }
          NODE
          pg_dump --schema-only --no-owner --no-privileges forge_test > src/persistence/canonical-schema.sql
          test -s src/persistence/canonical-schema.sql
      - name: Replace migration runner and remove migrations
        shell: bash
        run: |
          set -euo pipefail
          cat > src/migrate.js <<'NODE'
          const { Pool } = require('pg');
          const fs = require('node:fs/promises');
          const path = require('node:path');
          async function main(){
            if(!process.env.DATABASE_URL) throw new Error('DATABASE_URL is required');
            const pool=new Pool({connectionString:process.env.DATABASE_URL,max:2});
            try{const sql=await fs.readFile(path.join(__dirname,'persistence','canonical-schema.sql'),'utf8'); await pool.query(sql); console.log(JSON.stringify({status:'ok',mode:'canonical-schema'}));}
            finally{await pool.end();}
          }
          main().catch(e=>{console.error('Forge schema bootstrap failed:',e.message);process.exitCode=1});
          NODE
          rm -rf migrations
          rm -f .github/workflows/build-canonical-schema.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(db): replace migrations with canonical fresh schema'
          git push origin HEAD:codex/fresh-db-schema
