services:
  - type: web
    name: forge-studio-api
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: API_BEARER_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
