services:
  - type: web
    name: forge-studio-api
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: API_BEARER_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: FORGE_RUNNER_CALLBACK_TOKEN
        sync: false
      - key: FORGE_SECRET_ENCRYPTION_KEY
        sync: false
      - key: FORGE_RUNTIME_POLICY_ENABLED
        value: "true"
      - key: FORGE_REQUIRE_SECRET_ENCRYPTION
        value: "true"
      - key: RUN_MIGRATIONS_ON_START
        value: "false"
  - type: worker
    name: forge-studio-worker
    runtime: docker
    plan: starter
    dockerCommand: node src/runtime/worker-entry.js
    disk:
      name: forge-render-scratch
      mountPath: /var/lib/forge
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: "8080"
      - key: PG_POOL_MAX
        value: "5"
      - key: FORGE_SECRET_ENCRYPTION_KEY
        sync: false
      - key: FORGE_REQUIRE_SECRET_ENCRYPTION
        value: "true"
      - key: FORGE_COST_ENFORCEMENT_ENABLED
        value: "true"
      - key: FORGE_USAGE_RESERVATION_TTL_MS
        value: "900000"
      - key: FORGE_USAGE_RECOVERY_INTERVAL_MS
        value: "60000"
      - key: FORGE_USAGE_PRICING_JSON
        sync: false
      - key: FORGE_USAGE_BUDGETS_JSON
        sync: false
      - key: FORGE_GITHUB_ACTIONS_ENABLED
        value: "true"
      - key: FORGE_GITHUB_ACTIONS_MODE
        value: github
      - key: FORGE_GITHUB_REPOSITORY
        value: akashdnb/forge-studio
      - key: FORGE_GITHUB_TOKEN
        sync: false
      - key: FORGE_GITHUB_REF
        sync: false
      - key: FORGE_GITHUB_EXECUTION_TIMEOUT_MS
        value: "1800000"
      - key: FORGE_GITHUB_DISPATCH_GRACE_MS
        value: "60000"
      - key: FORGE_GITHUB_MAX_DISPATCHES_PER_TICK
        value: "2"
      - key: FORGE_STORAGE_DRIVER
        value: s3
      - key: FORGE_STORAGE_MAX_BYTES
        value: "10737418240"
      - key: FORGE_STORAGE_S3_BUCKET
        sync: false
      - key: FORGE_STORAGE_S3_REGION
        sync: false
      - key: FORGE_STORAGE_S3_ENDPOINT
        sync: false
      - key: FORGE_STORAGE_S3_FORCE_PATH_STYLE
        value: "false"
      - key: FORGE_RENDER_WORKDIR
        value: "/var/lib/forge"
      - key: FORGE_RENDER_OUTPUT_DIR
        value: "/var/lib/forge/renders"
      - key: FORGE_RENDER_TIMEOUT_MS
        value: "900000"
      - key: FORGE_RECONCILIATION_INTERVAL_MS
        value: "300000"
      - key: FORGE_RECONCILIATION_SCAN_LIMIT
        value: "50"
      - key: FORGE_RECONCILIATION_RECENT_MINUTES
        value: "60"
      - key: FORGE_DIFF_MAX_CONCURRENCY
        value: "2"
      - key: FORGE_DIFF_TIMEOUT_MS
        value: "600000"
      - key: FORGE_DIFF_MAX_NODES
        value: "20000"
      - key: FORGE_DIFF_MAX_ITEMS
        value: "100000"
      - key: FORGE_STAGE_RESEARCH_ENDPOINT
        sync: false
      - key: FORGE_STAGE_SCRIPT_ENDPOINT
        sync: false
      - key: FORGE_STAGE_SCENE_PLAN_ENDPOINT
        sync: false
      - key: FORGE_STAGE_NARRATION_ENDPOINT
        sync: false
      - key: FORGE_STAGE_ASSETS_ENDPOINT
        sync: false
      - key: FORGE_STAGE_TIMELINE_ENDPOINT
        sync: false
      - key: FORGE_STAGE_PROVIDER_TOKEN
        sync: false
      - key: FORGE_QA_TIMEOUT_MS
        value: "600000"
      - key: FORGE_QA_MAX_BYTES
        value: "5368709120"
      - key: FORGE_QA_ALLOWED_MEDIA_HOSTS
        sync: false
      - key: FORGE_S3_REGION
        sync: false
      - key: FORGE_S3_ENDPOINT
        sync: false
      - key: FORGE_S3_FORCE_PATH_STYLE
        value: "false"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: FORGE_WORKER_HANDLERS
        value: src/recovery/combined-worker-handlers.js
      - key: FORGE_GENERATION_HANDLER_MODULE
        value: src/generation/worker-handlers.js
      - key: FORGE_GENERATION_TIMEOUT_MS
        value: "600000"
      - key: FORGE_GENERATION_MAX_ATTEMPTS
        value: "3"
      - key: FORGE_GENERATION_MAX_OUTPUT_BYTES
        value: "536870912"
      - key: FORGE_GENERATION_MAX_TEXT_CHARS
        value: "2000000"
      - key: FORGE_GENERATION_MAX_WIDTH
        value: "16384"
      - key: FORGE_GENERATION_MAX_HEIGHT
        value: "16384"
      - key: FORGE_GENERATION_MAX_DURATION_SECONDS
        value: "3600"
      - key: FORGE_IMAGE_GENERATION_COMMAND
        sync: false
      - key: FORGE_IMAGE_GENERATION_ARGS
        sync: false
      - key: FORGE_IMAGE_GENERATION_PROVIDER
        sync: false
      - key: FORGE_IMAGE_GENERATION_MODEL
        sync: false
      - key: FORGE_VIDEO_GENERATION_COMMAND
        sync: false
      - key: FORGE_VIDEO_GENERATION_ARGS
        sync: false
      - key: FORGE_VIDEO_GENERATION_PROVIDER
        sync: false
      - key: FORGE_VIDEO_GENERATION_MODEL
        sync: false
      - key: FORGE_TEXT_GENERATION_COMMAND
        sync: false
      - key: FORGE_TEXT_GENERATION_ARGS
        sync: false
      - key: FORGE_TEXT_GENERATION_PROVIDER
        sync: false
      - key: FORGE_TEXT_GENERATION_MODEL
        sync: false
      - key: YOUTUBE_ACCESS_TOKEN
        sync: false
      - key: YOUTUBE_REFRESH_TOKEN
        sync: false
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
  - type: worker
    name: forge-studio-event-worker
    runtime: docker
    plan: starter
    dockerCommand: node src/events/delivery-worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FORGE_EVENT_SECRET_KEY
        sync: false
      - key: FORGE_EVENT_POLL_MS
        value: "1000"
      - key: FORGE_EVENT_FANOUT_BATCH
        value: "100"
      - key: FORGE_EVENT_DELIVERY_BATCH
        value: "10"
      - key: FORGE_EVENT_RECOVERY_EVERY
        value: "10"
      - key: FORGE_EVENT_PG_POOL_MAX
        value: "5"
  - type: web
    name: forge-studio-event-api
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8090"
      - key: FORGE_EVENT_PORT
        value: "8090"
      - key: DATABASE_URL
        sync: false
      - key: FORGE_EVENT_SECRET_KEY
        sync: false
      - key: FORGE_AUTH_SIGNING_SECRET
        sync: false
      - key: API_BEARER_TOKEN
        sync: false
      - key: FORGE_STATIC_ACTOR_ID
        sync: false
      - key: FORGE_STATIC_TENANT_ID
        sync: false
  - type: web
    name: forge-studio-ui
    runtime: static
    staticPublishPath: ./public
