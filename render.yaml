services:
  - type: web
    name: forge-studio-api
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: API_BEARER_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
  - type: worker
    name: forge-studio-worker
    runtime: docker
    plan: starter
    startCommand: node src/worker.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PG_POOL_MAX
        value: "5"
  - type: web
    name: forge-studio-ui
    runtime: static
    staticPublishPath: ./public
