services:
  - type: web
    name: forge-studio-api
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: API_BEARER_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: RUN_MIGRATIONS_ON_START
        value: "false"
  - type: worker
    name: forge-studio-worker
    runtime: docker
    plan: starter
    dockerCommand: node src/worker.js
    disk:
      name: forge-render-scratch
      mountPath: /var/lib/forge
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PORT
        value: "8080"
      - key: PG_POOL_MAX
        value: "5"
      - key: FORGE_STORAGE_DRIVER
        value: s3
      - key: FORGE_STORAGE_MAX_BYTES
        value: "10737418240"
      - key: FORGE_STORAGE_S3_BUCKET
        sync: false
      - key: FORGE_STORAGE_S3_REGION
        sync: false
      - key: FORGE_STORAGE_S3_ENDPOINT
        sync: false
      - key: FORGE_STORAGE_S3_FORCE_PATH_STYLE
        value: "false"
      - key: FORGE_RENDER_WORKDIR
        value: "/var/lib/forge"
      - key: FORGE_RENDER_OUTPUT_DIR
        value: "/var/lib/forge/renders"
      - key: FORGE_RENDER_TIMEOUT_MS
        value: "900000"
      - key: FORGE_RECONCILIATION_INTERVAL_MS
        value: "300000"
      - key: FORGE_RECONCILIATION_SCAN_LIMIT
        value: "50"
      - key: FORGE_RECONCILIATION_RECENT_MINUTES
        value: "60"
      - key: FORGE_RECONCILIATION_PARTIAL_MAX_AGE_MINUTES
        value: "60"
      - key: FORGE_STAGE_RESEARCH_ENDPOINT
        sync: false
      - key: FORGE_STAGE_SCRIPT_ENDPOINT
        sync: false
      - key: FORGE_STAGE_SCENE_PLAN_ENDPOINT
        sync: false
      - key: FORGE_STAGE_NARRATION_ENDPOINT
        sync: false
      - key: FORGE_STAGE_ASSETS_ENDPOINT
        sync: false
      - key: FORGE_STAGE_TIMELINE_ENDPOINT
        sync: false
      - key: FORGE_STAGE_PROVIDER_TOKEN
        sync: false
      - key: FORGE_QA_TIMEOUT_MS
        value: "600000"
      - key: FORGE_QA_MAX_BYTES
        value: "5368709120"
      - key: FORGE_QA_ALLOWED_MEDIA_HOSTS
        sync: false
      - key: FORGE_S3_REGION
        sync: false
      - key: FORGE_S3_ENDPOINT
        sync: false
      - key: FORGE_S3_FORCE_PATH_STYLE
        value: "false"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: FORGE_WORKER_HANDLERS
        sync: false
      - key: YOUTUBE_ACCESS_TOKEN
        sync: false
      - key: YOUTUBE_REFRESH_TOKEN
        sync: false
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
  - type: web
    name: forge-studio-ui
    runtime: static
    staticPublishPath: ./public
